<ion-header>
  <ion-toolbar>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (prod of productos; track prod.id) {
      <ion-item>
        <ion-label>{{ prod.nombre }}</ion-label>
        @if (prod.stock === 0) {
          <ion-badge slot="end" color="danger">
            Agotado
          </ion-badge>
        }
      </ion-item>
    }
  </ion-list>
</ion-content>
